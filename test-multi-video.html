<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Video Test</title>
</head>
<body>
    <h1>Multi-Video Render Test</h1>
    <button id="testBtn">Test Multi-Video Render</button>
    <div id="status"></div>
    <div id="logs"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const logsDiv = document.getElementById('logs');
        
        function log(message) {
            console.log(message);
            logsDiv.innerHTML += `<p>${message}</p>`;
        }
        
        async function testMultiVideoRender() {
            try {
                statusDiv.innerHTML = 'Testing...';
                log('🧪 Starting multi-video render test...');
                
                const payload = {
                    design: {
                        trackItems: [
                            {
                                id: "test-video-1",
                                type: "video", 
                                display: { from: 0, to: 3000 },
                                details: { 
                                    src: "http://localhost:3001/uploads/videos/17040ae4-48b2-4910-9081-6a2553a4f9cb.mp4" 
                                }
                            },
                            {
                                id: "test-video-2",
                                type: "video",
                                display: { from: 3000, to: 6000 },
                                details: { 
                                    src: "http://localhost:3001/uploads/videos/35f07a69-3caa-4c3b-a7b2-b3fdade1f39d.mp4" 
                                }
                            }
                        ],
                        transitions: []
                    },
                    options: {
                        fps: 30,
                        size: { width: 1920, height: 1080 },
                        format: "mp4",
                        crf: 18
                    }
                };
                
                log('📤 Sending render request...');
                const response = await fetch('http://localhost:3001/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                log(`✅ Render started: ${result.renderId}`);
                
                // Poll status
                let status = 'PENDING';
                let attempts = 0;
                
                while (status === 'PENDING' && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    attempts++;
                    
                    const statusResponse = await fetch(`http://localhost:3001/status/${result.renderId}`);
                    const statusData = await statusResponse.json();
                    status = statusData.video.status;
                    
                    log(`📊 Status: ${status} (${statusData.video.progress}%)`);
                    
                    if (status === 'COMPLETED') {
                        log(`🎉 Success! Video: ${statusData.video.url}`);
                        statusDiv.innerHTML = `✅ SUCCESS! <a href="${statusData.video.url}" target="_blank">Download Video</a>`;
                        return;
                    } else if (status === 'FAILED') {
                        log(`❌ Failed: ${statusData.video.error}`);
                        statusDiv.innerHTML = '❌ FAILED';
                        return;
                    }
                }
                
                if (attempts >= 20) {
                    log('⚠ Timeout');
                    statusDiv.innerHTML = '⚠ TIMEOUT';
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                statusDiv.innerHTML = '❌ ERROR';
            }
        }
        
        document.getElementById('testBtn').addEventListener('click', testMultiVideoRender);
    </script>
</body>
</html>
