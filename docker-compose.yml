version: '3.8'

services:
  video-render-backend:
    build: ./video-render-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - MAX_CONCURRENT_RENDERS=2
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - video_uploads:/app/uploads
      - video_outputs:/app/outputs
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  video-editor:
    build: ./AI-avatar-frontend/react-video-editor-main
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3001
    depends_on:
      - video-render-backend
    restart: unless-stopped

volumes:
  video_uploads:
  video_outputs:
  redis_data:
